name: CI

on:
  push:
    branches: [master]
  pull_request:

# Runs on forks and fork pull requests too: no secrets, read-only token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22]
        include:
          - os: ubuntu-latest
            node: 24
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    name: Browser end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter playground exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/playground/playwright-report
          retention-days: 7

  package:
    name: Package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Pack exactly what npm would publish and install it into a clean project. No build
      # first: like a publish from a fresh clone, prepack has to build everything it needs.
      - run: pnpm --filter tencil pack --pack-destination "$RUNNER_TEMP"
      - name: Smoke-test the packed CLI
        run: |
          mkdir "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          npm init -y >/dev/null
          npm install "$RUNNER_TEMP"/tencil-*.tgz
          npx tencil --version
          node -e "import('tencil').then(m => { if (typeof m.startDaemon !== 'function') process.exit(1) })"
          # The packed daemon starts, answers and stops.
          export XDG_CONFIG_HOME="$RUNNER_TEMP/config" TENCIL_PORT=48777
          npx tencil start
          npx tencil status
          curl -sf http://127.0.0.1:48777/tencil.js > /dev/null
          npx tencil stop
